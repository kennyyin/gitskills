name: Deploy English Coach to GitHub Pages

on:
  push:
    branches:
      - claude/english-learning-tools-ilvw2n
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (english-speaking-coach as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: english-speaking-coach

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
